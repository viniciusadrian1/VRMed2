# Somente validação do certificado; não publica o tutor sem HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 2.28.109.190;
    location /.well-known/acme-challenge/ {
        root /var/www/vrmed-acme;
    }
    location / {
        default_type text/plain;
        return 503 "VRmed em preparacao.\n";
    }
}
