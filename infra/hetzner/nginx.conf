# Limites por IP e globais para conter abuso do tutor sem alterar as regras do Duelo.
limit_req_zone $binary_remote_addr zone=vrmed_ia_ip:10m rate=6r/m;
limit_req_zone $server_name zone=vrmed_ia_global:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=vrmed_audio_ip:10m rate=6r/m;
limit_req_zone $server_name zone=vrmed_audio_global:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=vrmed_admin:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=vrmed_conexoes:10m;

server {
    listen 80;
    listen [::]:80;
    server_name 2.28.109.190;
    location /.well-known/acme-challenge/ { root /var/www/vrmed-acme; }
    location / { return 308 https://2.28.109.190$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 2.28.109.190;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/vrmed-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrmed-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VRmedTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 512k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn vrmed_conexoes 80;
    limit_req_status 429;
    limit_conn_status 429;
    # URLs de SSE carregam identificadores: não armazenar consultas nem conversas em access logs.
    access_log off;
    error_log /var/log/nginx/vrmed-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # Não há Cloudflare à frente: rejeita identidade de IP enviada pelo cliente.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    # Preserva respostas progressivas e eventos do Duelo.
    proxy_buffering off;

    location ~ ^/api/(chat|flashcards)/?$ {
        limit_req zone=vrmed_ia_ip burst=6 nodelay;
        limit_req zone=vrmed_ia_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /api/transcricao {
        client_max_body_size 2m;
        client_body_timeout 30s;
        # Áudio segue direto para o app, sem arquivo temporário de upload no Nginx.
        proxy_request_buffering off;
        limit_req zone=vrmed_audio_ip burst=6 nodelay;
        limit_req zone=vrmed_audio_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # O painel administrativo só será exposto após configurar autenticação própria.
    location ~ ^/(admin|api/admin)(/|$) { return 403; }
    location ~ /\. { return 404; }
    location / { proxy_pass http://127.0.0.1:3000; }
}
